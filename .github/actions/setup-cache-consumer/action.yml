name: Prepare pinned public-cache consumer
description: Use one source-exact consumer and hash-locked dependencies for cache CI and publication
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: levencode-labs/deploom-mcp
        ref: d8307c5f54592e13ab3df6280ea67cbfacf638c7
        path: build/consumer-v2
        persist-credentials: false
    - shell: bash
      run: |
        python -m pip install --only-binary=:all: --require-hashes -r ci/cache-requirements.txt
    - shell: bash
      run: echo "PYTHONPATH=$GITHUB_WORKSPACE/build/consumer-v2/src:$GITHUB_WORKSPACE/cache" >> "$GITHUB_ENV"
