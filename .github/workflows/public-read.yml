name: Verify published cache
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
  workflow_run:
    workflows: ['pages build and deployment', 'Deploy public cache to Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  read:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python cache/probe_pages.py
      - name: Install the released DepLoom runtime from its hash lock
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r bin/posix-requirements.txt
      - name: Verify signed editions, reviewed corpus parity, and aggregate READY
        run: python ci/verify_public_data.py --source knowledge/v2/records.json --scopes knowledge/v3/evidence-scopes.json --output public-data-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-public-data-verification
          path: public-data-verification.json
          if-no-files-found: error
