name: Test the Windows npm archive
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'ci/**'
      - 'licenses/**'
      - 'vendor/**'
      - 'package.json'
      - '.github/workflows/windows-package.yml'
  pull_request:
    paths: ['bin/**', 'ci/**', 'licenses/**', 'vendor/**', 'package.json', '.github/workflows/windows-package.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache g++-mingw-w64-x86-64-posix
      - name: Identify the cross compiler and headers
        id: toolchain
        run: |
          digest=$(dpkg-query -W 'gcc-mingw*' 'g++-mingw*' 'mingw-w64*' 'binutils-mingw*' ccache | sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: ~/.cache/ccache
          key: z3-mingw-v1-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('ci/build-z3-mingw.sh') }}
      - name: Build the original solver without MSVC runtime dependencies
        run: bash ci/build-z3-mingw.sh
      - run: ccache --show-stats
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: portable-z3
          path: build/solver/output/*
          if-no-files-found: error
          retention-days: 7
  candidate:
    needs: solver
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: ${{ !inputs.release }}
        with:
          repository: levencode-labs/deploom-mcp
          ref: cc6854f2625cc8a77557b4cd098667dae7634f58
          submodules: true
          path: build/upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the development MCP wheel
        if: ${{ !inputs.release }}
        run: |
          python -m pip install build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m build --wheel build/upstream --outdir build/wheels
      - name: Download the reviewed public release wheel
        if: inputs.release
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE) { throw 'Release tag must point to a commit on main' }
          $lock = Get-Content -Raw ci/mcp-release.json | ConvertFrom-Json
          $name = "deploom_mcp-$($lock.version)-py3-none-any.whl"
          $url = "https://github.com/levencode-labs/deploom-mcp/releases/download/v$($lock.version)/$name"
          if ($lock.url -ne $url) { throw 'Unexpected MCP release asset URL' }
          New-Item -ItemType Directory build/wheels -Force | Out-Null
          $dest = Join-Path build/wheels $name
          Invoke-WebRequest $url -OutFile $dest
          if ((Get-FileHash $dest).Hash -ne $lock.sha256) { throw 'MCP release wheel digest mismatch' }
      - uses: actions/download-artifact@v4
        with:
          name: portable-z3
          path: build/solver
      - name: Verify public runtime inputs
        run: python -B ci/fetch_inputs.py build/inputs
      - name: Check development and release package identity
        run: python -B -m unittest discover -s ci -p test_assemble.py
      - name: Build and inspect the tarball
        run: |
          $wheel = (Get-ChildItem build/wheels/*.whl).FullName
          $hash = (Get-FileHash $wheel).Hash.ToLowerInvariant()
          python -B ci/assemble.py --python-archive build/inputs/python-embed.zip --solver build/solver --wheelhouse build/inputs --mcp-wheel $wheel --mcp-sha256 $hash --output build/package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location build/package
          npm.cmd pack --offline --pack-destination .. --quiet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          $tarball = (Get-ChildItem build/*.tgz).FullName
          python -B ci/check_archive.py build/package $tarball
      - name: Install offline in a clean Windows Server Core container
        run: ./ci/test-clean-windows.ps1 -Tarball (Get-ChildItem build/*.tgz).FullName
      - name: Install supported clients for the smoke test
        run: ./ci/install-test-clients.ps1
      - name: Install offline and run each configured MCP server
        run: |
          $tarball = (Get-ChildItem build/*.tgz).FullName
          ./ci/test-install.ps1 -Tarball $tarball -Work (Join-Path $PWD 'build/smoke')
      - name: Exercise interrupted activation, recovery and rollback
        run: |
          Copy-Item build/package build/previous -Recurse
          # Both fixture versions use the qualified runtime to isolate activation behavior.
          node -e "const fs=require('node:fs'); for (const [file,key] of [['package.json','version'],['runtime-manifest.json','cliVersion']]) { const p='build/previous/'+file; const doc=JSON.parse(fs.readFileSync(p)); doc[key]='0.0.0-activation.fixture'; fs.writeFileSync(p,JSON.stringify(doc)); }"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node ci/verify-activation.cjs build/previous build/package build/activation
      - name: Verify anonymous public cache from two installed profiles
        run: |
          & ./build/smoke/install/node_modules/@levencode/deploom/runtime/python.exe -I -B ci/probe_public_cache.py build/live-cache
      - uses: actions/download-artifact@v4
        if: inputs.release
        with:
          pattern: posix-*
          merge-multiple: true
          path: build/native
      - name: Record upstream identity for downstream
        if: inputs.release
        run: |
          $tarball = (Get-ChildItem build/*.tgz).FullName
          python ci/describe_release.py $tarball ci/mcp-release.json build/upstream.json build/native
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: verified-npm
          path: |
            build/*.tgz
            build/upstream.json
          if-no-files-found: error
