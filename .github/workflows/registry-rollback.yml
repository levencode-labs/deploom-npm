name: Verify published npm update and rollback
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Published npm channel to verify
        type: choice
        options: [latest, next]
        default: latest
  workflow_call:
    inputs:
      expected-version:
        type: string
        required: true
  push:
    paths: ['ci/test-registry-rollback.ps1', 'ci/verify-published-release.py', '.github/workflows/registry-rollback.yml']
permissions:
  contents: read
jobs:
  consumer:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.published.outputs.version }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the consumer CLI
        run: npm.cmd install --global @openai/codex@0.165.0
      - name: Install both published releases and exercise the registered MCP after each switch
        id: published
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
        run: |
          $channel = 'next'
          if ($env:EXPECTED_VERSION -and !$env:EXPECTED_VERSION.Contains('-')) { $channel = 'latest' }
          if (!$env:EXPECTED_VERSION -and $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $channel = if ($env:MANUAL_CHANNEL) { $env:MANUAL_CHANNEL } else { 'latest' }
          }
          if ($channel -cnotin @('latest', 'next')) { throw 'Unsupported npm channel' }
          $current = npm.cmd view "@levencode/deploom@$channel" version --registry=https://registry.npmjs.org/ --prefer-online
          if ($LASTEXITCODE -or $current -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Public channel version unavailable' }
          if ($env:EXPECTED_VERSION -and $current -cne $env:EXPECTED_VERSION) { throw 'Unexpected version on the public channel' }
          "version=$current" >> $env:GITHUB_OUTPUT
          $versions = npm.cmd view '@levencode/deploom' versions --json --registry=https://registry.npmjs.org/ --prefer-online
          if ($LASTEXITCODE) { throw 'Unable to read published npm versions' }
          $published = $versions -join "`n" | ConvertFrom-Json
          $previousTag = "npm-v$current"
          do {
            $previousTag = git describe --first-parent --tags --abbrev=0 --match 'npm-v*' "${previousTag}^1"
            if ($LASTEXITCODE -or $previousTag -notlike 'npm-v*') { throw 'No previous published npm release tag' }
          } until ($published -ccontains $previousTag.Substring(5))
          ./ci/test-registry-rollback.ps1 -Previous $previousTag.Substring(5) -Current $current -Work (Join-Path $env:RUNNER_TEMP 'rollback-consumer')
  offline-evidence:
    if: ${{ !inputs.expected-version }}
    needs: consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify published assets and collect offline evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.consumer.outputs.version }}
        run: python -B ci/verify-published-release.py "$VERSION" handoff
      - uses: actions/upload-artifact@v4
        with:
          name: verified-upstream-evidence
          path: |
            handoff/*.json
            handoff/*.jsonl
          if-no-files-found: error
