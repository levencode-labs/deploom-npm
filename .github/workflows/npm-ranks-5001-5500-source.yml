name: npm ranks 5001-5500 source-only pin
on:
  pull_request:
    paths:
      - 'research/npm-ranks-5001-5500-20261123/**'
      - '.github/workflows/npm-ranks-5001-5500-source.yml'
permissions:
  contents: read
jobs:
  source:
    name: pinned source / part ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Strict pinned CSV identity and only 100 source rows
        run: python research/npm-ranks-5001-5500-20261123/source_bootstrap.py --part ${{ matrix.part }}
