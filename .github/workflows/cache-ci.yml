name: Public data checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: records-admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node fixtures/react-renderers/check.cjs
      - run: node fixtures/react-ssr/check.cjs
      - run: node fixtures/react19-renderer-commit/check.cjs
      - run: npx --yes --package=npm@11.16.0 -- node fixtures/vitest-vite-peer/check.cjs
      - name: Check the Vitest mock transform
        working-directory: fixtures/vitest5-hoisted-mocks
        run: |
          npm ci --prefix v4 --ignore-scripts --no-audit --no-fund
          npm ci --prefix v5 --ignore-scripts --no-audit --no-fund
          node check.cjs
      - uses: ./.github/actions/setup-cache-consumer
      - name: Keep the released strict v2 reader in the compatibility matrix
        uses: actions/checkout@v4
        with:
          repository: levencode-labs/deploom-mcp
          ref: 73e4bcc04ec2a2c3aa85008a94b3a6958a03012d
          path: build/consumer-legacy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: levencode-labs/deploom-mcp
          ref: f57246f111104934853c56f2e8fb7efa192a7d33
          path: build/contracts
          persist-credentials: false
      - name: Validate the public snapshots with the consumer contract
        env:
          PYTHONPATH: build/contracts/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from deploom_mcp.record_contract import parse, validate
          for kind in ("history", "knowledge"):
              rows = parse(Path(f"docs/v1/{kind}.json").read_bytes())
              print(kind, len(validate(kind, rows)))
          PY
          python ci/check_record_signature.py
      - name: Validate native records, negative controls, and signed MCP compatibility
        env:
          PYTHONPATH: build/consumer-v2/src:cache
        run: |
          python -m unittest discover -s cache -v
          python ci/test_knowledge_editions.py --legacy-consumer build/consumer-legacy

  renderer-fixture-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node fixtures/react19-renderer-commit/check.cjs
