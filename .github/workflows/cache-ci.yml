name: Public data checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node fixtures/react-renderers/check.cjs
      - run: node fixtures/react-ssr/check.cjs
      - name: Check Vitest hoisted APIs on the exact release pair
        working-directory: fixtures/vitest5-hoisted-mocks
        run: |
          npm ci --prefix v4 --ignore-scripts --no-audit --no-fund
          npm ci --prefix v5 --ignore-scripts --no-audit --no-fund
          node check.cjs
      - uses: actions/checkout@v4
        with:
          repository: levencode-labs/deploom-mcp
          ref: f57246f111104934853c56f2e8fb7efa192a7d33
          path: build/contracts
          persist-credentials: false
      - run: 'python -m pip install --only-binary=:all: jsonschema==4.25.1 "cryptography>=42"'
      - name: Validate the public snapshots with the consumer contract
        env:
          PYTHONPATH: build/contracts/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from deploom_mcp.record_contract import parse, validate
          for kind in ("history", "knowledge"):
              rows = parse(Path(f"docs/v1/{kind}.json").read_bytes())
              print(kind, len(validate(kind, rows)))
          PY
          python -m unittest discover -s cache -v
          python ci/check_record_signature.py
