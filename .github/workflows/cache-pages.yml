name: Deploy public cache to Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'cache/**', 'knowledge/v2/**', 'knowledge/v3/**', 'ci/cache-requirements.txt', 'ci/verify_public_data.py', '.github/actions/setup-cache-consumer/**', '.github/workflows/cache-pages.yml']
  workflow_run:
    workflows: ['Build public OSV release']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-public-deploom-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.sha }}
      v2_digest: ${{ steps.digest.outputs.v2_sha }}
      v3_digest: ${{ steps.digest.outputs.v3_sha }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: levencode-labs/deploom-mcp
          ref: f57246f111104934853c56f2e8fb7efa192a7d33
          path: build/contracts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv "$RUNNER_TEMP/records-venv"
          echo "$RUNNER_TEMP/records-venv/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-cache-consumer
      - run: cmp cache/records-public.hex build/contracts/src/deploom_mcp/records-public.hex
      - name: Reject stale coverage documentation before preparing public data
        run: python cache/coverage_map.py --check
      - name: Verify the release before advancing the pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cache/prepare_pages.py build/site
      - name: Build the signed data payload from the validated main tree
        env:
          PYTHONPATH: build/contracts/src
        run: python cache/records_intake.py "$(git rev-parse HEAD)" build/site/v1/cache.json
      - name: Validate pinned fixtures and publish legacy v2 plus reviewed scoped v3
        env:
          PYTHONPATH: build/consumer-v2/src:cache
        run: |
          python cache/shards_v3.py knowledge/v2/records.json knowledge/v3/evidence-scopes.json build/site --revision "$(git rev-list --first-parent --count HEAD)" --trusted-commit "$(git rev-parse HEAD)"
      - id: digest
        run: |
          echo "sha=$(sha256sum build/site/v1/cache.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "v2_sha=$(sha256sum build/site/v2/index.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "v3_sha=$(sha256sum build/site/v3/index.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-site
          path: build/site
          if-no-files-found: error
  sign:
    needs: prepare
    if: github.repository == 'levencode-labs/deploom-npm' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    environment: cache-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-site
          path: build/site
      - name: Verify exact validated bytes
        env:
          EXPECTED: ${{ needs.prepare.outputs.digest }}
        run: echo "$EXPECTED  build/site/v1/cache.json" | sha256sum --check
      - name: Check v2 index matches the reviewed candidate
        env:
          EXPECTED_V2: ${{ needs.prepare.outputs.v2_digest }}
        run: echo "$EXPECTED_V2  build/site/v2/index.json" | sha256sum --check
      - name: Check v3 index matches the reviewed candidate
        env:
          EXPECTED_V3: ${{ needs.prepare.outputs.v3_digest }}
        run: echo "$EXPECTED_V3  build/site/v3/index.json" | sha256sum --check
      - name: Sign the validated public snapshot
        env:
          DEPLOOM_RECORDS_SIGNING_KEY: ${{ secrets.DEPLOOM_RECORDS_SIGNING_KEY }}
        run: |
          node cache/sign-records.cjs build/site/v1/cache.json build/site/v1/cache.sig cache/records-public.hex
          node cache/sign-shards-v2.cjs build/site/v2/index.json build/site/v2/index.sig cache/records-public.hex
          node cache/sign-shards-v3.cjs build/site/v3/index.json build/site/v3/index.sig cache/records-public.hex
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/site
      - uses: actions/upload-artifact@v4
        with:
          name: signed-candidate
          path: build/site
          if-no-files-found: error
  verify-candidate:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: levencode-labs/deploom-core
          ref: 8c65fc7311062169d1b1e058c5463a39efaed3d9
          path: build/acceptance-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: levencode-labs/deploom-mcp
          ref: 0c990137e3b713f944cd7a053f04d0e8470af337
          path: build/acceptance-mcp
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/download-artifact@v4
        with:
          name: signed-candidate
          path: build/signed-candidate
      - name: Install current and legacy published wheels under exact hash locks
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r bin/posix-requirements.txt
          python -m venv "$RUNNER_TEMP/legacy-reader"
          python - <<'PY'
          import os
          from pathlib import Path
          lines = Path('bin/posix-requirements.txt').read_text().splitlines()
          lines = [line for line in lines if not line.startswith('deploom-mcp @ ')]
          lines.append('deploom-mcp @ https://github.com/levencode-labs/deploom-mcp/releases/download/v0.2.33/deploom_mcp-0.2.33-py3-none-any.whl --hash=sha256:6b500635388342d959b4013947dec99a4fbfaaea53e75aa27f9bbf6ef1404167')
          Path(os.environ['RUNNER_TEMP'], 'legacy-requirements.txt').write_text('\n'.join(lines) + '\n')
          PY
          "$RUNNER_TEMP/legacy-reader/bin/python" -m pip install --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/legacy-requirements.txt"
      - name: Run R01 and R02 with installed production modules and retained exact test sources
        run: python ci/qualify_installed_release.py --core-tests build/acceptance-core --mcp-tests build/acceptance-mcp --output installed-correctness.json
      - name: Preserve complete corpus, 45 lookups, signature and revision negatives on installed wheels
        run: python ci/test_knowledge_editions.py --installed-lock ci/mcp-release.json --legacy-python "$RUNNER_TEMP/legacy-reader/bin/python" > installed-parity.jsonl
      - name: Read the actual signed candidate before public deployment
        run: python ci/verify_signed_candidate.py --site build/signed-candidate --revision "$(git rev-list --first-parent --count HEAD)" --legacy-python "$RUNNER_TEMP/legacy-reader/bin/python" --output installed-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: installed-candidate-acceptance
          path: |
            installed-correctness.json
            installed-parity.jsonl
            installed-candidate.json
          if-no-files-found: error
  deploy:
    needs: verify-candidate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
  verify-installed:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the released DepLoom runtime from its hash lock
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r bin/posix-requirements.txt
      - name: Read both signed editions with the installed client and check OSV expiry
        run: python ci/verify_public_data.py --source knowledge/v2/records.json --scopes knowledge/v3/evidence-scopes.json --revision "$(git rev-list --first-parent --count HEAD)" --output public-data-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: installed-public-data-verification
          path: public-data-verification.json
          if-no-files-found: error
