name: Deploy public cache to Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'cache/**', '.github/workflows/cache-pages.yml']
  workflow_run:
    workflows: ['Build public OSV release']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-public-deploom-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.sha }}
      v2_digest: ${{ steps.digest.outputs.v2_sha }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: levencode-labs/deploom-mcp
          ref: f57246f111104934853c56f2e8fb7efa192a7d33
          path: build/contracts
          persist-credentials: false
      - run: |
          python -m venv "$RUNNER_TEMP/records-venv"
          echo "$RUNNER_TEMP/records-venv/bin" >> "$GITHUB_PATH"
      - run: 'python -m pip install --only-binary=:all: jsonschema==4.25.1'
      - run: cmp cache/records-public.hex build/contracts/src/deploom_mcp/records-public.hex
      - name: Verify the release before advancing the pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cache/prepare_pages.py build/site
      - name: Build the signed data payload from the validated main tree
        env:
          PYTHONPATH: build/contracts/src
        run: python cache/records_intake.py "$(git rev-parse HEAD)" build/site/v1/cache.json
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: levencode-labs/deploom-mcp
          ref: d624dd9d38f2f3ce97702631717f56621fcacb2d
          path: build/consumer-v2
          persist-credentials: false
      - name: Validate maintainer-controlled v2-native knowledge and pinned fixture claims
        env:
          PYTHONPATH: build/consumer-v2/src:cache
        run: |
          python cache/shards_v2.py knowledge/v2/records.json build/site/v2 --revision "$(git rev-list --first-parent --count HEAD)" --trusted-commit "$(git rev-parse HEAD)"
      - id: digest
        run: |
          echo "sha=$(sha256sum build/site/v1/cache.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "v2_sha=$(sha256sum build/site/v2/index.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-site
          path: build/site
          if-no-files-found: error
  sign:
    needs: prepare
    if: github.repository == 'levencode-labs/deploom-npm' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    environment: cache-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-site
          path: build/site
      - name: Verify exact validated bytes
        env:
          EXPECTED: ${{ needs.prepare.outputs.digest }}
        run: echo "$EXPECTED  build/site/v1/cache.json" | sha256sum --check
      - name: Check v2 index matches the reviewed candidate
        env:
          EXPECTED_V2: ${{ needs.prepare.outputs.v2_digest }}
        run: echo "$EXPECTED_V2  build/site/v2/index.json" | sha256sum --check
      - name: Sign the validated public snapshot
        env:
          DEPLOOM_RECORDS_SIGNING_KEY: ${{ secrets.DEPLOOM_RECORDS_SIGNING_KEY }}
        run: |
          node cache/sign-records.cjs build/site/v1/cache.json build/site/v1/cache.sig cache/records-public.hex
          node cache/sign-shards-v2.cjs build/site/v2/index.json build/site/v2/index.sig cache/records-public.hex
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/site
  deploy:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
