name: npm ranks 5501-6000 source-only pin
on:
  pull_request:
    paths:
      - 'research/npm-ranks-5501-6000-20261123/**'
      - '.github/workflows/npm-ranks-5501-6000-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: pinned source / part ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline boundary controls
        run: python -m unittest discover -s research/npm-ranks-5501-6000-20261123 -p 'test_*.py' -v
      - name: Verify pinned CSV and emit exact source rows only
        run: python research/npm-ranks-5501-6000-20261123/source_bootstrap.py --part ${{ matrix.part }}
