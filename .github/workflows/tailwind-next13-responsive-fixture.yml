name: Tailwind v4 and Next 13 responsive CSS fixture
on:
  pull_request:
    paths:
      - 'fixtures/tailwind4-next13-responsive-minifier/**'
      - '.github/workflows/tailwind-next13-responsive-fixture.yml'
  push:
    branches: [main]
    paths:
      - 'fixtures/tailwind4-next13-responsive-minifier/**'
      - '.github/workflows/tailwind-next13-responsive-fixture.yml'
permissions:
  contents: read
jobs:
  fixture:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fixtures/tailwind4-next13-responsive-minifier
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm test
