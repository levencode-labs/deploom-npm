name: npm top-500 research (read-only)
on:
  pull_request:
    paths:
      - 'research/npm-top500-2026-11/**'
      - '.github/workflows/npm-top500-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    name: pinned CSV and complete 500 selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline negative controls
        run: python -m unittest discover -s research/npm-top500-2026-11 -p 'test_*.py' -v
      - name: Download immutable source and verify all rows / both hashes
        run: python research/npm-top500-2026-11/top500.py inventory --download
  public-registry:
    name: exact npm version identities / subbatch ${{ matrix.part }}
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe exact public npm versions without credentials, proxies or redirects
        run: python research/npm-top500-2026-11/top500.py probe --part ${{ matrix.part }} --output registry-receipts/part-${{ matrix.part }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-top500-batch01-part-${{ matrix.part }}
          path: registry-receipts/part-${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 30
