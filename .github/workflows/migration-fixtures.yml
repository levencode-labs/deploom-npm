        working-directory: fixtures/biome2-assist-config
        run: |
          npm ci --prefix before --ignore-scripts --no-audit --no-fund --engine-strict --strict-peer-deps
          npm ci --prefix after --ignore-scripts --no-audit --no-fund --engine-strict --strict-peer-deps
          node check.cjs
      - name: "Verify tRPC 11 HTTP link transformer"
        working-directory: fixtures/trpc11-link-transformer
        run: |
          npm ci --prefix before --omit=optional --ignore-scripts --no-audit --no-fund --engine-strict --strict-peer-deps
          npm ci --prefix after --omit=optional --ignore-scripts --no-audit --no-fund --engine-strict --strict-peer-deps
