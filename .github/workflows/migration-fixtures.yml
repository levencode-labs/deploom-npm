          done

  github-breaking-api:
    name: GitHub npm API and config migration fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install pinned API and ESM fixture arms
        run: |
          set -eu
          for fixture in fixtures/npm-github-{api,esm}-contracts/*/; do
            case "${fixture%/}" in
              */vite*|*/tailwindcss*) optional=--include=optional ;;
              *) optional=--omit=optional ;;
            esac
            npm ci --prefix "$fixture" "$optional" --ignore-scripts --no-audit --no-fund --strict-peer-deps
          done
      - name: Verify API, config and CommonJS loader changes
        run: |
          node fixtures/npm-github-api-contracts/check.cjs
          node fixtures/npm-github-esm-contracts/check.cjs
      - name: Verify the second API, configuration and codemod batch
        run: |
          set -eu
          for lock in fixtures/npm-github-api-config-002/*/package-lock.json; do
            npm ci --prefix "${lock%/package-lock.json}" --omit=optional --ignore-scripts --no-audit --no-fund --strict-peer-deps
          done
          for arm in before after; do
            npm ci --prefix "fixtures/npm-github-biome-002/$arm" --include=optional --ignore-scripts --no-audit --no-fund --strict-peer-deps
          done
          node fixtures/npm-github-api-config-002/check.cjs
          node fixtures/npm-github-biome-002/check.cjs
      - name: Verify remaining exact API and configuration transitions
        run: |
          set -eu
          for lock in fixtures/npm-github-api-tail/*/package-lock.json; do
            npm ci --prefix "${lock%/package-lock.json}" --omit=optional --ignore-scripts --no-audit --no-fund --strict-peer-deps
          done
          node fixtures/npm-github-api-tail/check.cjs
