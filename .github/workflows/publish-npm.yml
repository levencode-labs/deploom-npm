name: Publish verified npm package
on:
  push:
    tags: ['npm-v*']
permissions:
  contents: read
concurrency:
  group: publish-deploom-npm
  cancel-in-progress: false
jobs:
  posix:
    uses: ./.github/workflows/posix-package.yml
  build:
    needs: posix
    uses: ./.github/workflows/windows-package.yml
    with:
      release: true
  source-security:
    uses: ./.github/workflows/source-security.yml
  package-security:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-npm
          path: archives
      - uses: actions/download-artifact@v4
        with:
          pattern: posix-*
          merge-multiple: true
          path: archives
      - run: python3 ci/prepare_security_scan.py archives "$RUNNER_TEMP/scan"
      - name: Scan the four packed runtimes for known vulnerabilities and secrets
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          docker run --rm --volume "$RUNNER_TEMP/scan:/scan:ro" --volume "$RUNNER_TEMP/report:/out" --env TRIVY_DISABLE_TELEMETRY=true \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb fs --scanners vuln,secret --offline-scan --severity HIGH,CRITICAL --list-all-pkgs --format json --output /out/scan-report.json --timeout 20m /scan
          python3 ci/prepare_security_scan.py archives "$RUNNER_TEMP/scan" --report "$RUNNER_TEMP/report/scan-report.json"
  publish:
    needs: [build, source-security, package-security]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-npm
          path: verified
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Publish the tested tarball with npm trusted publishing
        working-directory: verified
        run: |
          set -euo pipefail
          tarball=$(jq -er .tarball upstream.json)
          version=$(jq -er .version upstream.json)
          integrity=$(jq -er .integrity upstream.json)
          test "$GITHUB_REF_NAME" = "npm-v$version"
          test "$integrity" = "sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          channel=latest
          if [[ "$version" == *-* ]]; then channel=next; fi
          if existing=$(npm view "@levencode/deploom@$version" dist.integrity --registry=https://registry.npmjs.org/ 2>/dev/null) && [[ -n "$existing" ]]; then
            test "$existing" = "$integrity"
          else
            npm publish "./$tarball" --registry=https://registry.npmjs.org/ --access public --tag "$channel" --provenance
          fi
  registry-install:
    needs: publish
    runs-on: windows-2025
    outputs:
      version: ${{ steps.registry.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: verified-npm
          path: verified
      - name: Install supported clients
        run: ./ci/install-test-clients.ps1
      - name: Read back the public tarball and use the documented install command
        id: registry
        run: |
          $release = Get-Content verified/upstream.json -Raw | ConvertFrom-Json
          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          $spec = "$($release.name)@$($release.version)"
          $installSpec = if ($release.version.Contains('-')) { $spec } else { $release.name }
          $env:npm_config_cache = Join-Path $env:RUNNER_TEMP 'new-npm-cache'
          $env:npm_config_registry = 'https://registry.npmjs.org/'
          New-Item -ItemType Directory readback | Out-Null
          # npm can expose metadata before the scanned tarball is available.
          foreach ($attempt in 1..41) {
            npm.cmd pack $spec --pack-destination readback --prefer-online --fetch-retries=0 --quiet
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 41) { throw "Published archive $spec is still unavailable after 20 minutes" }
            Start-Sleep -Seconds 30
          }
          $received = (Get-ChildItem readback/*.tgz).FullName
          $tested = (Get-ChildItem verified/*.tgz).FullName
          if ((Get-FileHash $received -Algorithm SHA512).Hash -ne (Get-FileHash $tested -Algorithm SHA512).Hash) { throw 'Registry tarball changed' }
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'registry-codex'
          $env:CODEX_HOME = Join-Path $env:USERPROFILE '.codex'
          $env:LOCALAPPDATA = Join-Path $env:USERPROFILE 'local'
          # npm resolves a matching package from the current project before using the registry.
          New-Item -ItemType Directory -Path $env:USERPROFILE | Out-Null
          Push-Location -LiteralPath $env:USERPROFILE
          try {
            $active = Join-Path $env:LOCALAPPDATA 'DepLoom/public/clients/codex/active.json'
            foreach ($attempt in 1..41) {
              $log = npm.cmd exec --prefer-online --yes "--package=$installSpec" -- deploom setup codex 2>&1
              $code = $LASTEXITCODE
              $log | ForEach-Object { Write-Host $_ }
              if ($code -eq 0) {
                $installed = (Get-Content -LiteralPath $active -Raw | ConvertFrom-Json).version
                if ($installed -ceq $release.version) { break }
                throw "Expected $($release.version) in the clean profile, installed $installed"
              }
              if ($attempt -eq 41 -or ($log -join "`n") -notmatch '\bETARGET\b') { exit $code }
              Start-Sleep -Seconds 30
            }
          } finally { Pop-Location }
          ./ci/test-install.ps1 -Tarball $received -Work (Join-Path $PWD 'registry-smoke')
  registry-rollback:
    needs: registry-install
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/registry-rollback.yml
    with:
      expected-version: ${{ needs.registry-install.outputs.version }}
  registry-native:
    needs: registry-install
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install clients and exercise the public npm package from a clean profile
        run: |
          npm install --prefix "$RUNNER_TEMP/deploom-clients" @openai/codex@0.165.0 @anthropic-ai/claude-code@2.1.241
          python3 ci/posix-opencode.py "$RUNNER_TEMP/deploom-clients/node_modules/.bin"
          PATH="$RUNNER_TEMP/deploom-clients/node_modules/.bin:$PATH" python3 ci/test-posix.py --registry "@levencode/deploom@${GITHUB_REF_NAME#npm-v}"
  downstream:
    needs: [registry-native, registry-rollback]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-npm
          path: verified
      - uses: actions/download-artifact@v4
        with:
          pattern: posix-*
          merge-multiple: true
          path: verified
      - uses: actions/attest@v4
        with:
          subject-path: verified/*
      - name: Publish immutable downstream artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_flags=(--latest)
            if [[ "${GITHUB_REF_NAME#npm-v}" == *-* ]]; then release_flags=(--prerelease --latest=false); fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${release_flags[@]}" --title "$GITHUB_REF_NAME" --notes "Verified Windows, Linux and macOS npm archives and upstream contract."
          fi
          if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" verified/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir readback
          for file in verified/*; do cmp "$file" "readback/$(basename "$file")"; done
