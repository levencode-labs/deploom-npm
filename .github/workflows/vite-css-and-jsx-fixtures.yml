name: Vite stylesheet and JSX migration fixtures
on:
  pull_request:
    paths:
      - 'fixtures/vite-library-css-filename/**'
      - 'fixtures/fastify-htmx-vite-jsx/**'
      - '.github/workflows/vite-css-and-jsx-fixtures.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the exact Vite library CSS versions
        working-directory: fixtures/vite-library-css-filename
        run: |
          npx --yes --package=npm@11.16.0 -- npm ci --ignore-scripts --no-audit --no-fund
          node check.cjs node_modules/vite5/dist/node/index.js node_modules/vite8/dist/node/index.js "$RUNNER_TEMP"
      - name: Check the exact Fastify JSX versions
        working-directory: fixtures/fastify-htmx-vite-jsx
        run: |
          npx --yes --package=npm@11.16.0 -- npm ci --ignore-scripts --no-audit --no-fund
          node check.cjs
